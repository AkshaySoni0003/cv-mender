<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    font-size: 11pt;
    color: #1a1a1a;
    line-height: 1.7;
  }

  .sender { margin-bottom: 26px; }
  .sender-name { font-size: 14pt; font-weight: 700; color: #2c5282; }
  .sender-contact { font-size: 10pt; color: #718096; margin-top: 3px; }

  .date { color: #718096; font-size: 10pt; margin-bottom: 22px; }

  .recipient { margin-bottom: 26px; font-size: 10.5pt; line-height: 1.6; }
  .recipient-company { font-weight: 700; }
  .recipient-re { color: #2c5282; margin-top: 4px; }

  .body p { margin-bottom: 16px; }

  .signature { margin-top: 30px; }
  .signature-regards { color: #4a5568; margin-bottom: 22px; }
  .signature-name { font-weight: 700; font-size: 12pt; }
</style>
</head>
<body>

<div class="sender">
  <div class="sender-name">{{ name }}</div>
  <div class="sender-contact">
    {{ email }}{% if phone %} &nbsp;·&nbsp; {{ phone }}{% endif %}
  </div>
</div>

<div class="date">{{ date }}</div>

<div class="recipient">
  <div>Hiring Team</div>
  <div class="recipient-company">{{ company }}</div>
  <div class="recipient-re">Re: {{ job_title }}</div>
</div>

<div class="body">
  {% for paragraph in paragraphs %}
  <p>{{ paragraph }}</p>
  {% endfor %}
</div>

<div class="signature">
  <div class="signature-regards">Warm regards,</div>
  <div class="signature-name">{{ name }}</div>
</div>

</body>
</html>
